<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Portal</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#007474,#00b3b3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:white;
    width:340px;
    padding:40px 30px;
    border-radius:24px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:30px;
}

a{
    display:block;
    padding:16px;
    margin:15px 0;
    border-radius:14px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:0.3s;
}

a:hover{
    transform:translateY(-2px);
}

.lords{
    background:#111;
}

.onedna{
    background:#007474;
}

</style>
</head>

<body>

<div class="card">

    <h1>Welcome</h1>

    <p>Select your destination</p>

    <a class="lords"
       href="https://lordspath.com/"
       target="_blank">
       Lords Path
    </a>

    <a class="onedna"
       href="https://theonedna.com/"
       target="_blank">
       OneDNA
    </a>

</div>

</body>
</html>
