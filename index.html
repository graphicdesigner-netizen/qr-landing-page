<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Portal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#007474,#00b3b3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    background:white;
    width:380px;
    padding:40px 30px;
    border-radius:28px;
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,0.18);
}

h1{
    margin-bottom:10px;
    color:#007474;
    font-size:32px;
}

p{
    color:#fd852a;
    margin-bottom:35px;
    font-size:15px;
}

.portal-btn{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:14px 18px;
    margin:18px 0;
    border-radius:18px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:0.3s ease;
}

.portal-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.logo-circle{
    width:58px;
    height:58px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    flex-shrink:0;
}

.logo-circle img{
    width:80%;
    height:80%;
    object-fit:contain;
}

.btn-text{
    flex:1;
    text-align:left;
    font-size:18px;
}

.lords{
    background:#3d539e;
}

.onedna{
    background:#007474;
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:12px;
}

</style>
</head>

<body>

<div class="card">

    <h1>Welcome</h1>

    <p>Select your destination</p>

    <!-- Lords Path Button -->
    <a class="portal-btn lords"
       href="https://lordspath.com/"
       target="_blank">

        <div class="logo-circle">
            <img src="lordspath.png" alt="Lords Path Logo">
        </div>

        <div class="btn-text">
            Lords Path
        </div>

    </a>

    <!-- OneDNA Button -->
    <a class="portal-btn onedna"
       href="https://theonedna.com/"
       target="_blank">

        <div class="logo-circle">
            <img src="ONEDNA LOGO(1).png" alt="OneDNA Logo">
        </div>

        <div class="btn-text">
            OneDNA
        </div>

    </a>

    <div class="footer">
        Powered by Lords Mark Microbiotech
    </div>

</div>

</body>
</html>
